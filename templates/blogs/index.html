{% extends "layout/master.html" %} {% load static %} {% block page_title %}
About {% endblock %} {% block page_content %}
<main class="wrap">
  <div class="page-head">
    <h1 class="page-title">Blog</h1>
    <span class="count">{{ posts|length }} posts</span>
  </div>

  <ul class="cards">
    {% for item in posts %}
    <li class="card">
      <div class="card-body">
        <h2 class="card-title">
          <a href="{% url 'blogs_details' item.id %}">{{ item.title }}</a>
        </h2>
        <p class="card-excerpt">{{ item.content }}</p>
      </div>
    </li>
    {% endfor %}
  </ul>
</main>
{% endblock %}
